<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tamil Voice-to-Text</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px 60px;
    background: #f7f7fb;
    color: #222;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.sub { color: #666; margin-top: 0; }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  label { font-weight: 600; display: block; margin-bottom: 6px; font-size: 0.9rem; }
  input[type="password"], select {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 1rem;
  }
  .drop {
    border: 2px dashed #aaa;
    border-radius: 12px;
    padding: 28px 12px;
    text-align: center;
    color: #666;
    cursor: pointer;
    background: #fafafa;
  }
  .drop.dragover { border-color: #4a6cf7; background: #eef1ff; }
  input[type="file"] { display: none; }
  button {
    width: 100%;
    padding: 14px;
    font-size: 1.05rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    background: #4a6cf7;
    color: #fff;
    cursor: pointer;
    margin-top: 10px;
  }
  button:disabled { background: #aab4e0; cursor: not-allowed; }
  .file-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #eee;
    font-size: 0.95rem;
  }
  .status { font-size: 0.85rem; color: #888; }
  .status.ok { color: #1a9c4a; }
  .status.err { color: #d33; }
  textarea {
    width: 100%;
    min-height: 140px;
    border-radius: 8px;
    border: 1px solid #ccc;
    padding: 10px;
    font-size: 1rem;
    font-family: "Noto Sans Tamil", inherit;
  }
  .dl-btn { background: #1a9c4a; margin-top: 8px; }
  .small { font-size: 0.8rem; color: #999; margin-top: 6px; }
</style>
</head>
<body>

<h1>Tamil Voice-to-Text</h1>
<p class="sub">Convert M4A recordings to Tamil text, right in your browser.</p>

<div class="card">
  <label for="apiKey">API Key (paste once, saved on this device only)</label>
  <input type="password" id="apiKey" placeholder="Paste your Sarvam API key here">
</div>

<div class="card">
  <label for="mode">Transcription style</label>
  <select id="mode">
    <option value="transcribe">Clean transcript (recommended)</option>
    <option value="verbatim">Verbatim (include filler words)</option>
    <option value="codemix">Tamil + English mixed speech</option>
    <option value="translate">Translate to English</option>
  </select>
</div>

<div class="card">
  <label>Audio files</label>
  <div class="drop" id="dropZone">
    Tap to choose M4A files<br><span class="small">or drag and drop them here</span>
  </div>
  <input type="file" id="fileInput" accept=".m4a,audio/*" multiple>
  <div id="fileList"></div>
  <button id="goBtn" disabled>Transcribe</button>
</div>

<div class="card" id="resultsCard" style="display:none;">
  <label>Results</label>
  <div id="results"></div>
</div>

<script>
const apiKeyInput = document.getElementById('apiKey');
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const fileListEl = document.getElementById('fileList');
const goBtn = document.getElementById('goBtn');
const resultsCard = document.getElementById('resultsCard');
const resultsEl = document.getElementById('results');
const modeSelect = document.getElementById('mode');

let files = [];

apiKeyInput.value = localStorage.getItem('sarvam_api_key') || '';
apiKeyInput.addEventListener('input', () => {
  localStorage.setItem('sarvam_api_key', apiKeyInput.value.trim());
});

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  addFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => addFiles(fileInput.files));

function addFiles(fileListObj) {
  for (const f of fileListObj) files.push(f);
  renderFileList();
}

function renderFileList() {
  fileListEl.innerHTML = '';
  files.forEach((f, i) => {
    const row = document.createElement('div');
    row.className = 'file-row';
    row.innerHTML = `<span>${f.name}</span><span class="status" id="status-${i}">waiting</span>`;
    fileListEl.appendChild(row);
  });
  goBtn.disabled = files.length === 0;
}

goBtn.addEventListener('click', async () => {
  const apiKey = apiKeyInput.value.trim();
  if (!apiKey) { alert('Please paste your API key first.'); return; }
  if (files.length === 0) return;

  goBtn.disabled = true;
  goBtn.textContent = 'Transcribing...';
  resultsCard.style.display = 'block';
  resultsEl.innerHTML = '';

  for (let i = 0; i < files.length; i++) {
    const statusEl = document.getElementById(`status-${i}`);
    statusEl.textContent = 'processing...';
    try {
      const transcript = await transcribeFile(files[i], apiKey, modeSelect.value);
      statusEl.textContent = 'done';
      statusEl.classList.add('ok');
      addResultBlock(files[i].name, transcript);
    } catch (err) {
      statusEl.textContent = 'failed';
      statusEl.classList.add('err');
      addResultBlock(files[i].name, 'ERROR: ' + err.message);
    }
  }

  goBtn.disabled = false;
  goBtn.textContent = 'Transcribe';
});

async function transcribeFile(file, apiKey, mode) {
  const formData = new FormData();
  formData.append('file', file, file.name);
  formData.append('model', 'saaras:v3');
  formData.append('mode', mode);
  formData.append('language_code', 'ta-IN');

  const response = await fetch('https://api.sarvam.ai/speech-to-text', {
    method: 'POST',
    headers: { 'api-subscription-key': apiKey },
    body: formData
  });

  if (!response.ok) {
    const text = await response.text();
    throw new Error(`API error ${response.status}: ${text}`);
  }
  const data = await response.json();
  return data.transcript || '(empty transcript)';
}

function addResultBlock(filename, transcript) {
  const wrapper = document.createElement('div');
  wrapper.style.marginBottom = '18px';
  const label = document.createElement('div');
  label.style.fontWeight = '600';
  label.style.marginBottom = '4px';
  label.textContent = filename;
  const textarea = document.createElement('textarea');
  textarea.value = transcript;
  const dlBtn = document.createElement('button');
  dlBtn.className = 'dl-btn';
  dlBtn.textContent = 'Download .txt';
  dlBtn.onclick = () => downloadText(filename.replace(/\.[^/.]+$/, '') + '.txt', transcript);
  wrapper.appendChild(label);
  wrapper.appendChild(textarea);
  wrapper.appendChild(dlBtn);
  resultsEl.appendChild(wrapper);
}

function downloadText(filename, text) {
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
